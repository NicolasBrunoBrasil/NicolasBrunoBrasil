name: Build APK

on:
  push:
    branches: [ "claude/**", main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar bundle do editor (three.js + esbuild)
        run: |
          npm install --no-save --no-audit --no-fund three@0.160.0 esbuild@0.20.2
          npx esbuild web/src/main.js --bundle --format=iife \
            --outfile=web/dist/app.js --log-level=warning
          ls -la web/dist/

      - name: Compilar APK assinado
        run: bash scripts/build_apk.sh

      - name: Comitar artefatos de volta na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/dist/app.js apk/Estudio3D.apk
          if git diff --cached --quiet; then
            echo "nada novo para comitar"
          else
            git commit -m "build: bundle web + APK assinado [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publicar Release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create estudio3d-apk \
            --title "Estúdio 3D — APK para instalar" \
            --notes "Baixe o **Estudio3D.apk** abaixo e instale no tablet (Android 10 ou superior). Modelagem 3D com S Pen, importa/exporta STL, 3MF, OBJ e GLB." \
            --target "${GITHUB_SHA}" 2>/dev/null || true
          gh release upload estudio3d-apk apk/Estudio3D.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio3D-apk
          path: apk/Estudio3D.apk
